<!-- Bagian Kalkulator dalam index.html -->
<section id="kalkulator" class="py-16 bg-white border-y border-slate-200">
    <div class="max-w-4xl mx-auto px-4">
        <div class="bg-slate-50 p-6 md:p-8 rounded-2xl border border-slate-200 grid md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pilih Layanan</label>
                    <select id="pilihanLayanan" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm focus:outline-blue-600">
                        <option value="7000" data-type="kilo">Cuci Kiloan Reguler (Rp 7.000/kg)</option>
                        <option value="20000" data-type="kilo">Cuci Kiloan Kilat (Rp 20.000/kg)</option>
                        <option value="25000" data-type="unit">Cuci Karpet Besar (Rp 25.000/pcs)</option>
                        <option value="10000" data-type="unit">Cuci Karpet Kecil (Rp 10.000/pcs)</option>
                    </select>
                </div>
                <div>
                    <!-- ID labelInput sangat penting agar teks berubah otomatis -->
                    <label id="labelInput" class="block text-xs font-bold text-slate-500 uppercase mb-1">Perkiraan Berat (kg)</label>
                    <!-- ID inputBerat -->
                    <input type="number" id="inputBerat" value="1" min="1" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm focus:outline-blue-600">
                </div>
            </div>
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-6 flex flex-col justify-between">
                <div>
                    <span class="text-xs uppercase font-bold text-blue-600 tracking-wider">Total Estimasi Biaya</span>
                    <!-- ID hasilHitung -->
                    <h3 id="hasilHitung" class="text-3xl font-extrabold text-blue-900 mt-2">Rp 7.000</h3>
                </div>
                <a href="#" id="linkWa" class="mt-4 block text-center bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow text-sm">
                    Pesan via WhatsApp
                </a>
            </div>
        </div>
    </div>
</section>
